name: Build C#

on:
  push:
    paths:
      - 'SAST/csharp/**'
      - 'SAST/csharp/build.yml'
  pull_request:
    paths:
      - 'SAST/csharp/**'
      - 'SAST/csharp/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Create temporary project
        run: |
          mkdir -p /tmp/csharp-build
          cat > /tmp/csharp-build/csharp-build.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
            </PropertyGroup>
          </Project>
          EOF
          cat > /tmp/csharp-build/Program.cs <<'EOF'
          using System;
          class Program { static void Main() => Console.WriteLine("C# example build"); }
          EOF
          cp SAST/csharp/*.cs /tmp/csharp-build/ 2>/dev/null || true

      - name: Build project
        run: dotnet build /tmp/csharp-build/csharp-build.csproj -c Release
