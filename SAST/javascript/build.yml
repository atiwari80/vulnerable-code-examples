name: Build JavaScript

on:
  push:
    paths:
      - 'SAST/javascript/**'
      - 'SAST/javascript/build.yml'
  pull_request:
    paths:
      - 'SAST/javascript/**'
      - 'SAST/javascript/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: |
          node --check SAST/javascript/sample.js
