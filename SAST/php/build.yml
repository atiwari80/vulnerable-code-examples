name: Build PHP

on:
  push:
    paths:
      - 'SAST/php/**'
      - 'SAST/php/build.yml'
  pull_request:
    paths:
      - 'SAST/php/**'
      - 'SAST/php/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint PHP files
        run: |
          find SAST/php -name '*.php' -print0 | xargs -0 -n1 php -l
